			margin:0px;
			}
			@media not all and (min-width: 300px) and (min-height: 180px){

			@media all and (min-width: 300px) and (min-height: 180px){
				#NoContent{
				display:none;

				#Content{
				display:block;
				}

			margin-bottom:30px;

			#Content-Header{
			display:block;
			text-align:center;
			}
			#Content-Header a{
			display:inline-block;
			font-size:2em;
			font-weight:bold;
			text-decoration:none;
			color:rgb(135,206,235);
			text-shadow:0px 0px 5px rgb(135,206,235);
			}
			#Content-Header a:hover{
			color:rgb(135,206,250);
			text-shadow:0px 0px 5px rgb(135,206,250);
			}
			#Content-Body{
			display:block;

			margin-bottom:20px;
			margin-left:auto;
			margin-right:auto;
			text-align:center;
			}
			#Content-Body-Links{
			display:block;
			}
			#Content-Body-Links a{
			display:block;
			padding:10px;
			font-size:1.1em;
			color:rgb(0,0,0);
			background-color:transparent;
			text-align:center;
			border-radius:0px;
			text-decoration:none;
			}
			#Content-Body-Links a:first-child{
			border-top-left-radius:5px;
			border-top-right-radius:5px;
			}
			#Content-Body-Links a:last-child{
			border-bottom-left-radius:5px;
			border-bottom-right-radius:5px;
			}
			#Content-Body-Links a:hover{
