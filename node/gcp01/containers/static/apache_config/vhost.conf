# == mcarvalhor ==

Alias /_scripts /doc_root/_scripts

<Directory /doc_root>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
</Directory>

# These match the codes handled by error.php.
ErrorDocument 400 /_scripts/error.php
ErrorDocument 401 /_scripts/error.php
ErrorDocument 403 /_scripts/error.php
ErrorDocument 404 /_scripts/error.php
ErrorDocument 405 /_scripts/error.php
ErrorDocument 408 /_scripts/error.php
ErrorDocument 429 /_scripts/error.php
ErrorDocument 500 /_scripts/error.php
ErrorDocument 501 /_scripts/error.php
ErrorDocument 502 /_scripts/error.php
ErrorDocument 503 /_scripts/error.php
ErrorDocument 504 /_scripts/error.php

<VirtualHost *:443>
        ServerName mcarvalhor.com
        ServerAlias www.mcarvalhor.com
        ServerAlias *.mcarvalhor.com
        ServerAdmin webmaster@localhost
        DocumentRoot /doc_root/www.mcarvalhor.com
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cloudflare.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cloudflare.key
        php_flag display_errors Off
        php_flag display_startup_errors Off
        php_flag log_errors On
        # 32767 == E_ALL
        php_value error_reporting 32767
</VirtualHost>

