# == mcarvalhor ==

# The shared error scripts live at /doc_root/_scripts, which is outside every
# vhost DocumentRoot. Expose them through an alias so ErrorDocument (a URL path,
# not a filesystem path) can reach them.
Alias /_errors /doc_root/_scripts

<Directory /doc_root>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
</Directory>

# These match the codes handled by error.php.
ErrorDocument 400 /_errors/error.php
ErrorDocument 401 /_errors/error.php
ErrorDocument 403 /_errors/error.php
ErrorDocument 404 /doc_root/_scripts/error.php
ErrorDocument 405 /_errors/error.php
ErrorDocument 408 /_errors/error.php
ErrorDocument 429 /_errors/error.php
ErrorDocument 500 /_errors/error.php
ErrorDocument 501 /_errors/error.php
ErrorDocument 502 /_errors/error.php
ErrorDocument 503 /_errors/error.php
ErrorDocument 504 /_errors/error.php

# Modern TLS hardening (applies to all SSL vhosts below).
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder on

<VirtualHost *:443>
        ServerName mcarvalhor.com
        ServerAlias www.mcarvalhor.com
        ServerAlias *.mcarvalhor.com
        ServerAdmin webmaster@localhost
        DocumentRoot /doc_root/www.mcarvalhor.com
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cloudflare.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cloudflare.key
        php_flag display_errors Off
        php_flag display_startup_errors Off
        php_flag log_errors On
        # 32767 == E_ALL
        php_value error_reporting 32767
</VirtualHost>

