# == mcarvalhor ==

<Directory /doc_root>
        AllowOverride All
</Directory>

<VirtualHost *:443>
        ServerName mcarvalhor.com
        ServerAlias www.mcarvalhor.com
        ServerAdmin webmaster@localhost
        DocumentRoot /doc_root/www.mcarvalhor.com
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cloudflare.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cloudflare.key
</VirtualHost>

<VirtualHost *:443>
        ServerName admin.mcarvalhor.com
        ServerAdmin webmaster@localhost
        DocumentRoot /doc_root/admin.mcarvalhor.com
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cloudflare.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cloudflare.key
</VirtualHost>

<VirtualHost *:443>
        ServerName internetsoftwareconnect.mcarvalhor.com
        ServerAdmin webmaster@localhost
        DocumentRoot /doc_root/internetsoftwareconnect.mcarvalhor.com
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cloudflare.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cloudflare.key
</VirtualHost>

<VirtualHost *:443>
        ServerName resources.mcarvalhor.com
        ServerAdmin webmaster@localhost
        DocumentRoot /doc_root/resources.mcarvalhor.com
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cloudflare.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cloudflare.key
</VirtualHost>


